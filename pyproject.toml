[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinality-audit-mvad"
version = "1.0.0"
description = "Cardinality-confounding diagnostics and fixed-order evaluation for multi-view anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Bailin Xiong"},
  {name = "Qiguo Hu", email = "swpihqg@cqjtu.edu.cn"},
  {name = "Kai Du"},
  {name = "Jinhui Tang"},
  {name = "Renxiang Wang"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "code"}
packages = ["cardinality_audit"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
