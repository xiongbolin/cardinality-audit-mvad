[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robovlmad"
version = "0.9.0"
description = "Frozen-feature anomaly evidence aggregation and cardinality controls for RAD"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "Pillow", "PyYAML", "tqdm"]

[project.optional-dependencies]
gpu = ["torch", "torchvision", "timm", "open-clip-torch", "anomalib"]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
