name: Unpack full reproducibility release

on:
  push:
    branches: [main]
    paths:
      - release_chunks_final/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify release
        shell: bash
        run: |
          set -euo pipefail
          test -f release_chunks_final/READY
          test "$(find release_chunks_final -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 32
          cat release_chunks_final/part-*.b64 | tr -d '\n\r' | base64 -d > CARDINALITY_AUDIT_FULL_RELEASE_v1.0.0.tar.xz
          echo "b0cf3cbbbe4e2b0d0a88a48131c72db7008eeee65d39c591a16232480aaea1f1  CARDINALITY_AUDIT_FULL_RELEASE_v1.0.0.tar.xz" | sha256sum -c -
          rm -rf .release-unpack
          mkdir .release-unpack
          tar -xJf CARDINALITY_AUDIT_FULL_RELEASE_v1.0.0.tar.xz -C .release-unpack
          test -d .release-unpack/cardinality-audit-mvad
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '*.pyc' \
            .release-unpack/cardinality-audit-mvad/ ./
          rm -rf .release-unpack CARDINALITY_AUDIT_FULL_RELEASE_v1.0.0.tar.xz release_chunks_final release_parts release_chunks_v1

      - name: Validate release contents
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q
          test -f code/run_cardinality_audit.py
          test -f data/rad_image_scores/dinov2_vit_b14_visual_image_scores.csv
          test -f figures/CA-FIG-04_realiad_controlled_cardinality_stress.png
          count=$(find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path '*/__pycache__/*' \
            ! -path '*/.pytest_cache/*' \
            ! -name '*.pyc' | wc -l)
          test "$count" -eq 62

      - name: Commit complete repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish complete reproducibility release"
            git push
          fi
