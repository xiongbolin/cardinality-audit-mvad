name: Apache-2.0 PatchCore release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify licensing and attribution
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f PATCHCORE_ATTRIBUTION.md
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0, January 2004" LICENSE
          grep -q "Copyright Amazon.com, Inc. or its affiliates" NOTICE
          grep -q "Apache License 2.0" PATCHCORE_ATTRIBUTION.md

      - name: Verify GitHub-ready package inventory
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            CITATION.cff
            DATA_NOTICE.md
            LICENSE_NOTICE.md
            SHA256SUMS.csv
            requirements.txt
            pyproject.toml
            configs
            scripts
            docs
            tests
          )
          for path in "${required[@]}"; do
            test -e "$path"
          done

      - name: Verify package checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f SHA256SUMS.csv

      - name: Install dependencies and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q
