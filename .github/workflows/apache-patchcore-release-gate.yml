name: Apache-2.0 PatchCore release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify licensing and attribution
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f PATCHCORE_ATTRIBUTION.md
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0, January 2004" LICENSE
          grep -q "Copyright Amazon.com, Inc. or its affiliates" NOTICE
          grep -q "Apache License 2.0" PATCHCORE_ATTRIBUTION.md

      - name: Verify GitHub-ready package inventory
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            CITATION.cff
            DATA_NOTICE.md
            LICENSE_NOTICE.md
            SHA256SUMS.csv
            requirements.txt
            pyproject.toml
            configs
            scripts
            docs
            tests
            results/current/patchcore_official
          )
          for path in "${required[@]}"; do
            test -e "$path"
          done
          if git ls-files | grep -E '\.(pt|pth|ckpt|onnx|safetensors)$'; then
            echo "Model binaries must be published as release assets, not ordinary Git files."
            exit 1
          fi

      - name: Verify package checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib
          from pathlib import Path
          with Path('SHA256SUMS.csv').open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert rows, 'empty checksum register'
          for row in rows:
              path = Path(row['path'])
              assert path.is_file(), f'missing checksum target: {path}'
              data = path.read_bytes()
              assert len(data) == int(row['bytes']), f'size mismatch: {path}'
              assert hashlib.sha256(data).hexdigest() == row['sha256'], f'hash mismatch: {path}'
          print(f'checksum verification: PASS ({len(rows)} files)')
          PY

      - name: Run release metadata tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pytest
          python scripts/verify_patchcore_release_metadata.py
          python -m pytest -q tests/test_patchcore_release_metadata.py
