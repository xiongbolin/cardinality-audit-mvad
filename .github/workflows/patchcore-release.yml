name: PatchCore release metadata verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-patchcore-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Verify frozen PatchCore release metadata
        run: python scripts/verify_patchcore_release_metadata.py
      - name: Run PatchCore release metadata test
        run: python -m pytest -q tests/test_patchcore_release_metadata.py
